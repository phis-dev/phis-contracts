name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Contributor License Agreement
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: main
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/phis-dev/.github/blob/main/CLA.md
          remote-organization-name: phis-dev
          remote-repository-name: cla-signatures
          allowlist: phi-systems-tech,*[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/phis-dev/.github/blob/main/CLA.md)
            and sign it by posting the sentence below as a comment on this pull
            request. You sign once; it covers every repository in this
            organisation and every future contribution.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
